<title>Ronin Test Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one step at a time, big glove-friendly controls, instrument-cluster amber accent */
:root {
  --bg: #f3f2ee;
  --panel: #ffffff;
  --fg: #1d1f22;
  --muted: #5d6168;
  --line: #d9d6cf;
  --accent: #c76a00;
  --accent-ink: #ffffff;
  --ok: #2d7d46;
  --bad: #b3261e;
  --hex-bg: #ece9e2;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315; --panel: #1b1e21; --fg: #eceae5; --muted: #a2a6ad; --line: #2e3237;
    --accent: #ffad33; --accent-ink: #1a1203; --ok: #5cc27c; --bad: #ff7a6e; --hex-bg: #24282c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315; --panel: #1b1e21; --fg: #eceae5; --muted: #a2a6ad; --line: #2e3237;
  --accent: #ffad33; --accent-ink: #1a1203; --ok: #5cc27c; --bad: #ff7a6e; --hex-bg: #24282c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.status { font-size: .8rem; color: var(--muted); }
.status b { color: var(--fg); font-weight: 600; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.part { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.6rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.body { margin: 0; color: var(--fg); }
.body li { margin-bottom: 4px; }
.hint { font-size: .85rem; color: var(--muted); margin: 0; }
.hex { font-family: var(--mono); font-size: .85rem; background: var(--hex-bg); border-radius: 8px; padding: 12px; word-break: break-all; user-select: all; }
.timer { font-family: var(--display); font-size: 3.2rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; color: var(--accent); }
.btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
button {
  font: 600 1.05rem var(--body); min-height: 56px; padding: 10px 14px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.yes { border-color: var(--ok); color: var(--ok); }
button.no { border-color: var(--bad); color: var(--bad); }
button.small { min-height: 44px; font-size: .9rem; }
button:disabled { opacity: .45; cursor: default; }
textarea { width: 100%; min-height: 64px; font: 400 1rem var(--body); padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
label { font-size: .85rem; color: var(--muted); }
.nav { display: flex; justify-content: space-between; gap: 10px; }
.log { font-size: .8rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; }
.log span { font-family: var(--mono); color: var(--fg); }
.toast { font-size: .85rem; color: var(--ok); min-height: 1.2em; }
@media (prefers-reduced-motion: reduce) { .progress > i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Ronin Test Guide</h1>
    <div class="status" id="saveState">Saving: <b>starting…</b></div>
  </header>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <div class="card" id="card"></div>
  <div class="nav">
    <button class="small" id="backBtn" type="button">← Back</button>
    <button class="small" id="restartBtn" type="button">New session</button>
  </div>
  <details>
    <summary class="hint">Results so far</summary>
    <div class="log" id="log"></div>
    <button class="small" id="copyAll" type="button" style="margin-top:8px">Copy all results</button>
    <div class="toast" id="copyToast"></div>
  </details>
</div>

<script>
(function () {
  // ---------- Ronin frame builders (see PROTOCOL.md) ----------
  const XOR = 0xEB;
  function xor(f) { return f.map((b, i) => (i >= 2 && i < f.length - 1) ? (b ^ XOR) : b); }
  function hex(f) { return f.map(b => b.toString(16).toUpperCase().padStart(2, "0")).join(""); }
  function text(header, s, max) {
    const f = new Array(20).fill(0); f[0] = 0x5B; f[1] = header; f[19] = 0xFF;
    const t = s.slice(0, max || 17);
    for (let i = 0; i < t.length; i++) f[2 + i] = t.charCodeAt(i) & 0x7F;
    return f;
  }
  function status(calls, sms) {
    const d = new Date(), h = d.getHours();
    return [0x5B, 0x4A, 0x44, 120, 0, 0, h, d.getMinutes(), d.getSeconds(), h < 12 ? 16 : 17,
      calls, 0, d.getDate(), d.getMonth() + 1, d.getFullYear() % 100, sms, 0, 0, 0, 0xFF];
  }
  function nav(nextM, minutes, leftM, picto, state) {
    return [0x5A, 0x4E, (nextM >> 8) & 255, nextM & 255, (minutes >> 8) & 255, minutes & 255,
      (leftM >> 16) & 255, (leftM >> 8) & 255, leftM & 255, picto, 1, 1, 0, 0, state, 0, 0, 0, 0, 0xFF];
  }
  const F = {
    name:   () => xor(text(0x52, "RONIN")),
    caller: () => xor(text(0x43, "9876543210")),
    sms:    () => xor(text(0x53, "TESTSMS", 16)),
    msg:    () => xor(text(0x4C, "HELLO RONIN")),
    status: () => xor(status(3, 2)),
    navSoon:  () => xor(nav(200, 5, 1500, 7, 1)),
    navLeft:  () => xor(nav(50, 4, 1300, 7, 3)),
    navRight: () => xor(nav(50, 4, 1300, 7, 4)),
    navText:  () => xor(text(0x4F, "TURN LEFT")),
    navDone:  () => xor(nav(0, 0, 0, 7, 8)),
  };

  // ---------- Steps ----------
  const DISPLAY_Q = ["Showed correctly", "Showed something else", "Nothing changed"];
  const YN = ["Yes", "No"];
  const STEPS = [
    { part: "Setup", title: "Turn on Bluetooth recording", body: ["Settings → Additional settings → Developer options.", "Enable Bluetooth HCI snoop log → Enabled.", "Turn Bluetooth OFF, then ON again."], answers: ["Done"] },
    { part: "Setup", title: "Connect your intercom", body: ["Connect the Q8 intercom to the phone (voice replies need a headset)."], answers: ["Connected", "Skip"] },
    { part: "A · Official app", title: "Connect TVS Connect", body: ["Ignition ON.", "Open TVS Connect and connect to the bike.", "Tap Done the moment it says connected."], answers: ["Done"] },
    { part: "A · Official app", title: "Hands off for 20 seconds", body: ["Don't touch anything. Watch the bike display and the phone."], wait: 20, question: "Did the assistant start by itself (\"Listening\" on the bike or the phone)?", answers: YN },
    { part: "A · Official app", title: "Check the screen", body: ["Look at the bike display."], question: "Is it showing the customer window (phone signal + phone battery icons)?", answers: YN, note: true },
    { part: "A · Official app", title: "Long press I — try 1", body: ["Only if the customer window is showing.", "Hold the I button for 3 seconds, then release."], wait: 10, question: "Did \"Listening\" appear?", answers: YN, note: true },
    { part: "A · Official app", title: "Long press I — try 2", body: ["Wait until the assistant is gone and the customer window is back.", "Hold the I button for 3 seconds."], wait: 10, question: "Did \"Listening\" appear?", answers: YN, note: true },
    { part: "A · Official app", title: "Long press I — try 3", body: ["Same again: customer window showing, hold I for 3 seconds."], wait: 10, question: "Did \"Listening\" appear?", answers: YN, note: true },
    { part: "A · Official app", title: "Short press I", body: ["Customer window showing. Press I once, quickly."], wait: 10, question: "Did anything happen?", answers: YN, note: true },
    { part: "A · Official app", title: "Call: accept with I", body: ["Needs someone to call you. Skip if no one can.", "When the caller shows on the bike, HOLD I for 3 seconds."], question: "Was the call answered?", answers: ["Yes", "No", "Skip"], note: true },
    { part: "A · Official app", title: "Call: reject with I", body: ["Skip if no one can call.", "When the caller shows, press I once, quickly."], question: "Was the call rejected?", answers: ["Yes", "No", "Skip"], note: true },
    { part: "A · Official app", title: "Close TVS Connect", body: ["Settings → Apps → TVS Connect → Force stop.", "Keep the ignition ON."], answers: ["Done"] },
    { part: "B · Our messages", title: "Connect with nRF Connect", body: ["Open nRF Connect → connect TVS22XXXXXXXX.", "Client tab → Unknown Service.", "On 0x5354 tap the triple-arrow (subscribe)."], answers: ["Done"] },
    { part: "B · Our messages", title: "Send: greeting", frame: "name", body: ["On 0x5352 tap the up-arrow → BYTE ARRAY → paste → Send."], expect: "Expected: \"Hi RONIN\"", question: "What did the display show?", answers: DISPLAY_Q, note: true },
    { part: "B · Our messages", title: "Send: incoming caller", frame: "caller", body: ["Paste and send like before."], expect: "Expected: caller 9876543210", question: "What did the display show?", answers: DISPLAY_Q, note: true },
    { part: "B · Our messages", title: "Send: SMS sender", frame: "sms", body: ["Paste and send."], expect: "Expected: SMS from TESTSMS", question: "What did the display show?", answers: DISPLAY_Q, note: true },
    { part: "B · Our messages", title: "Send: text message", frame: "msg", body: ["Paste and send."], expect: "Expected: HELLO RONIN", question: "What did the display show?", answers: DISPLAY_Q, note: true },
    { part: "B · Our messages", title: "Send: missed calls + clock", frame: "status", fresh: true, body: ["This one includes the current time, so tap Copy just before sending."], expect: "Expected: 3 missed calls, 2 SMS, clock set to now", question: "What did the display show?", answers: DISPLAY_Q, note: true },
    { part: "C · Navigation", title: "Send: turn in 200 m", frame: "navSoon", body: ["Paste and send."], expect: "Expected: an arrow / 200 m (may need navigation mode)", question: "What did the display show?", answers: DISPLAY_Q, note: true },
    { part: "C · Navigation", title: "Send: turn instruction text", frame: "navText", body: ["Paste and send."], expect: "Expected: TURN LEFT", question: "What did the display show?", answers: DISPLAY_Q, note: true },
    { part: "C · Navigation", title: "Send: turn LEFT now", frame: "navLeft", body: ["Paste and send."], expect: "Expected: left arrow, 50 m", question: "What did the display show?", answers: DISPLAY_Q, note: true },
    { part: "C · Navigation", title: "Send: turn RIGHT now", frame: "navRight", body: ["Paste and send."], expect: "Expected: right arrow, 50 m", question: "What did the display show?", answers: DISPLAY_Q, note: true },
    { part: "C · Navigation", title: "Send: arrived", frame: "navDone", body: ["Paste and send."], expect: "Expected: arrived / destination flag", question: "What did the display show?", answers: DISPLAY_Q, note: true },
    { part: "D · Buttons with nRF", title: "I button while nRF is connected", body: ["Customer window (if showing): hold I for 3 seconds.", "Then press I once, quickly."], wait: 10, question: "Anything on the display?", answers: YN, note: true },
    { part: "Finish", title: "Wrap up", body: ["Disconnect nRF Connect. Ignition OFF.", "Back home: plug the phone into the Mac and tell Claude."], answers: ["Finished"] },
  ];

  // ---------- State ----------
  const $ = id => document.getElementById(id);
  let idx = 0, session = newSession(), results = [], db = null, timerId = null;
  function newSession() { return "s" + new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14); }
  function localTime(d) { return d.toLocaleTimeString("en-GB", { hour12: false }) + "." + String(d.getMilliseconds()).padStart(3, "0"); }
  try {
    const saved = JSON.parse(localStorage.getItem("roninGuide") || "null");
    if (saved && saved.session) { session = saved.session; idx = saved.idx || 0; results = saved.results || []; }
  } catch (e) {}
  function persistLocal() { try { localStorage.setItem("roninGuide", JSON.stringify({ session, idx, results })); } catch (e) {} }

  function setSave(t) { $("saveState").innerHTML = ""; $("saveState").append("Saving: "); const b = document.createElement("b"); b.textContent = t; $("saveState").append(b); }

  async function initDb() {
    try {
      const c = window.claude;
      if (!c || !c.use) { setSave("this phone only"); return; }
      db = await c.use("db");
      setSave(db ? "to Claude ✓" : "this phone only");
    } catch (e) { setSave("this phone only"); }
  }

  async function record(step, answer, note) {
    const d = new Date();
    const r = { session, stepNo: idx + 1, part: step.part, step: step.title, answer, note: note || "",
      localTime: localTime(d), iso: d.toISOString(), epochMs: d.getTime() };
    if (step.frame) r.frameSent = step._hex || "";
    results.push(r); persistLocal(); renderLog();
    if (db) {
      try { await db.collection("events").add(r); setSave("to Claude ✓"); }
      catch (e) { setSave("this phone only (" + (e && e.code || "error") + ")"); }
    }
  }

  // ---------- Rendering ----------
  function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  function render() {
    clearInterval(timerId);
    const s = STEPS[Math.min(idx, STEPS.length - 1)];
    $("bar").style.width = Math.round(100 * idx / (STEPS.length - 1)) + "%";
    const card = $("card"); card.innerHTML = "";
    card.append(el("div", "part", s.part + " · step " + (idx + 1) + " of " + STEPS.length));
    card.append(el("h2", null, s.title));
    const ul = el("ul", "body"); s.body.forEach(t => ul.append(el("li", null, t))); card.append(ul);

    if (s.frame) {
      const h = hex(F[s.frame]()); s._hex = h;
      const box = el("div", "hex", h); card.append(box);
      const copy = el("button", "primary", "Copy bytes"); copy.type = "button";
      const toast = el("div", "toast");
      copy.onclick = () => {
        const v = s.fresh ? hex(F[s.frame]()) : h; s._hex = v; box.textContent = v;
        const ok = () => { toast.textContent = "Copied at " + localTime(new Date()); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(v).then(ok, () => { select(box); toast.textContent = "Long-press the bytes to copy"; });
        } else { select(box); toast.textContent = "Long-press the bytes to copy"; }
      };
      card.append(copy, toast);
      if (s.expect) card.append(el("p", "hint", s.expect));
    }

    let answersWrap = el("div", "btns");
    let noteBox = null;
    if (s.wait) {
      const t = el("div", "timer", s.wait + "s"); card.append(t);
      let left = s.wait; answersWrap.style.opacity = ".45";
      timerId = setInterval(() => { left--; t.textContent = left > 0 ? left + "s" : "Answer now"; if (left <= 0) { clearInterval(timerId); answersWrap.style.opacity = "1"; } }, 1000);
    }
    if (s.question) card.append(el("p", "body", s.question));
    if (s.note) {
      const lab = el("label", null, "Note (optional): what exactly did you see?"); lab.htmlFor = "note" + idx;
      noteBox = el("textarea"); noteBox.id = "note" + idx;
      card.append(lab, noteBox);
    }
    (s.answers || ["Done"]).forEach((a, i) => {
      const b = el("button", (a === "Yes" || a === "Showed correctly") ? "yes" : (a === "No" || a === "Nothing changed") ? "no" : (i === 0 ? "primary" : ""), a);
      b.type = "button";
      b.onclick = async () => {
        await record(s, a, noteBox ? noteBox.value.trim() : "");
        if (idx < STEPS.length - 1) { idx++; persistLocal(); render(); window.scrollTo(0, 0); }
        else { card.append(el("p", "toast", "All done. Results saved.")); }
      };
      answersWrap.append(b);
    });
    card.append(answersWrap);
    $("backBtn").disabled = idx === 0;
  }

  function select(node) { try { const r = document.createRange(); r.selectNodeContents(node); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } catch (e) {} }

  function renderLog() {
    const log = $("log"); log.innerHTML = "";
    if (!results.length) { log.append(el("div", null, "Nothing yet. Your answers appear here with the exact time.")); return; }
    results.slice().reverse().forEach(r => {
      const row = el("div"); const t = el("span", null, r.localTime);
      row.append(t, document.createTextNode("  " + r.step + " → " + r.answer + (r.note ? " (" + r.note + ")" : "")));
      log.append(row);
    });
  }

  $("backBtn").onclick = () => { if (idx > 0) { idx--; persistLocal(); render(); } };
  $("restartBtn").onclick = () => {
    if ($("restartBtn").dataset.armed) { session = newSession(); idx = 0; results = []; persistLocal(); renderLog(); render(); $("restartBtn").textContent = "New session"; delete $("restartBtn").dataset.armed; }
    else { $("restartBtn").dataset.armed = "1"; $("restartBtn").textContent = "Tap again to start over"; setTimeout(() => { $("restartBtn").textContent = "New session"; delete $("restartBtn").dataset.armed; }, 4000); }
  };
  $("copyAll").onclick = () => {
    const txt = results.map(r => r.localTime + "\t" + r.step + "\t" + r.answer + (r.note ? "\t" + r.note : "") + (r.frameSent ? "\t" + r.frameSent : "")).join("\n");
    const done = () => { $("copyToast").textContent = "Copied " + results.length + " results"; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => { $("copyToast").textContent = "Copy blocked. Open this page in a browser and try again."; });
  };

  // Keep the screen awake at the bike if allowed.
  try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}

  renderLog(); render(); initDb();
})();
</script>
