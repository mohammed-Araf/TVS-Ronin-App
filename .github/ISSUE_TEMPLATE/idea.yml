name: Idea or suggestion
description: Something Ronin Dash should do, or do better
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and when would you use it (riding, parked, planning a trip…)?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters to you
