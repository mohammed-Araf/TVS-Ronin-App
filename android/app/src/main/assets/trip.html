<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trip map</title>
<link href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
<style>
  /* Clean: neutral surfaces, one accent colour, thin borders, no glow. Theme comes from the app. */
  :root {
    --bg: #f6f6f7; --card: #ffffff; --sub: #f0f0f2; --line: #e6e6ea; --fg: #16171a; --muted: #6b6d74;
    --accent: #e8930c; --on-accent: #ffffff;
  }
  :root.dark { --bg: #0f1012; --card: #18191c; --sub: #222327; --line: #2a2b30; --fg: #ededef; --muted: #9a9ba1; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100%; }
  .mapwrap { position: relative; flex: 1; min-height: 240px; }
  #map { position: absolute; inset: 0; }
  .bar { position: absolute; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); display: flex; gap: 8px; flex-wrap: wrap; z-index: 2; }
  .seg { position: relative; display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg button { position: relative; z-index: 1; border: 0; background: none; color: var(--muted); font: 500 13px system-ui; padding: 6px 10px; border-radius: 8px; min-height: 34px; }
  .seg button.on { color: var(--fg); }
  .seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 0; border-radius: 8px; background: var(--sub); box-shadow: 0 1px 2px rgba(0,0,0,.12);
    transition: transform .38s cubic-bezier(.3,1.25,.5,1), width .38s cubic-bezier(.3,1.25,.5,1); }
  .sheet { flex: none; max-height: 56%; overflow-y: auto; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px; background: var(--bg);
    /* Overlay look: the panel rides up over the map with rounded top corners, no hard edges. */
    position: relative; z-index: 4; margin-top: -22px; border-radius: 22px 22px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.22); }
  .sheet::before { content: ""; display: block; flex: none; width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: -4px auto 0; }
  .card { background: var(--card); border: 0; border-radius: 16px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  :root.dark .card { box-shadow: none; }
  .readout { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; }
  .readout b { display: block; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .readout span { font-size: 12px; color: var(--muted); }
  .readout .big b { font-size: 52px; line-height: 1; }
  .readout .mid { display: flex; flex-direction: column; gap: 6px; }
  .readout .mid b { font-size: 20px; }
  .readout .hl b { color: var(--accent); }
  .readout .fuel { text-align: right; }
  .readout .fuel b { font-size: 20px; }
  .readout .fuel span { display: block; }
  .readout .gear { width: 76px; height: 76px; border-radius: 16px; background: var(--sub); display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .readout .gear b { font-size: 44px; line-height: 1; color: var(--accent); }
  .readout .gear span { font-size: 11px; margin-top: 2px; }
  .readout b .roll, .readout b .roll span { font-size: inherit; color: inherit; margin: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .meta b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
  .meta a { color: var(--accent); text-decoration: none; }
  .gauges, .tiles { display: none; }
  .chartcard { padding: 12px 12px 10px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 0 2px 6px; align-items: center; }
  .legend i { display: inline-block; width: 12px; height: 2px; margin-right: 6px; vertical-align: middle; }
  #chart { width: 100%; height: 110px; display: block; touch-action: none; cursor: ew-resize; }
  .controls { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .play { width: 44px; height: 44px; border-radius: 50%; border: 0; flex: none; background: var(--accent); color: var(--on-accent); font-size: 15px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--muted); font: 500 13px system-ui; border-radius: 8px; padding: 7px 10px; min-height: 36px; }
  .chip.on { background: var(--sub); color: var(--fg); }
  .elapsed { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .grow { flex: 1; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 8px; }
  .tile b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile span { font-size: 12px; color: var(--muted); }
    h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
  /* Motion: cards rise in, controls ease, numbers count. */
  .card { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
  .card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .seg button, .chip, .credits button { transition: color .25s, background-color .2s, transform .18s cubic-bezier(.3,1.4,.5,1); }
  .seg button:active, .chip:active, .credits button:active { transform: scale(.9); }
  .play { position: relative; transition: transform .2s cubic-bezier(.3,1.5,.5,1), background-color .2s; }
  .play:active { transform: scale(.86); }
  .play svg { position: absolute; inset: 0; margin: auto; width: 18px; height: 18px; fill: currentColor;
    transition: transform .35s cubic-bezier(.3,1.3,.5,1), opacity .25s; }
  .play .ic-pause { transform: scale(.3) rotate(-90deg); opacity: 0; }
  .play.on .ic-play { transform: scale(.3) rotate(90deg); opacity: 0; }
  .play.on .ic-pause { transform: none; opacity: 1; }
  #cur, #curDot { transition: none; }
  #chart.glide #cur, #chart.glide #curDot { transition: transform .5s cubic-bezier(.2,.7,.2,1); }
  .readout b { transition: color .2s; }
  /* Rolling digits: new value slides in from below when it goes up, from above when it goes down. */
  .roll { display: inline-block; position: relative; overflow: hidden; vertical-align: bottom; height: 1.2em; line-height: 1.2em; }
  .roll > span { display: block; }
  .roll > .old { position: absolute; left: 0; top: 0; }
  .roll.up > .new { animation: inUp .45s cubic-bezier(.2,.7,.2,1) both; } .roll.up > .old { animation: outUp .45s cubic-bezier(.2,.7,.2,1) both; }
  .roll.down > .new { animation: inDown .45s cubic-bezier(.2,.7,.2,1) both; } .roll.down > .old { animation: outDown .45s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes inUp { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes outUp { to { transform: translateY(-100%); opacity: 0; } }
  @keyframes inDown { from { transform: translateY(-100%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes outDown { to { transform: translateY(100%); opacity: 0; } }
  /* Map credits: our own (i) pill. Opens and closes slowly enough to see, folds back by itself. */
  .credits { position: absolute; right: 12px; bottom: 36px; z-index: 3; display: flex; flex-direction: row-reverse; align-items: center;
    height: 32px; width: 32px; overflow: hidden; border-radius: 16px; background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 1px 4px rgba(0,0,0,.18); transition: width .6s cubic-bezier(.4,0,.2,1); }
  .credits button { flex: none; width: 30px; height: 30px; border: 0; background: none; color: var(--fg); font: 600 15px Georgia, serif; font-style: italic; }
  .credits span { white-space: nowrap; font-size: 11px; color: var(--muted); padding-left: 12px; opacity: 0; transition: opacity .25s ease; }
  .credits.open span { opacity: 1; transition: opacity .4s ease .25s; }

  /* Share sheet: slides up over a dimmed page, live card preview, style + format, Share / Save. */
  .shareov { position: fixed; inset: 0; z-index: 20; visibility: hidden; pointer-events: none; }
  .shareov.open { visibility: visible; pointer-events: auto; }
  .shareov .dim { position: absolute; inset: 0; background: rgba(0,0,0,.55); opacity: 0; transition: opacity .35s ease; }
  .shareov.open .dim { opacity: 1; }
  .sharesheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 96%; display: flex; flex-direction: column; gap: 12px;
    background: var(--bg); border-radius: 20px 20px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .45s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -8px 30px rgba(0,0,0,.25); }
  .shareov.open .sharesheet { transform: none; }
  .shareov.closing .sharesheet { transition-duration: .32s; transition-timing-function: cubic-bezier(.4,0,1,1); }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 2px auto 0; flex: none; }
  .sharehead { display: flex; align-items: center; justify-content: space-between; }
  .sharehead b { font-size: 17px; font-weight: 600; }
  .sharehead .x { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--sub); color: var(--muted); font-size: 15px;
    transition: transform .18s cubic-bezier(.3,1.4,.5,1); }
  .sharehead .x:active { transform: scale(.88); }
  .cardwrap { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; align-items: center; }
  #cardCv { display: block; max-width: 100%; max-height: 58vh; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.28);
    transition: opacity .2s ease, transform .35s cubic-bezier(.3,1.3,.5,1); }
  .shareov.open #cardCv { animation: cardIn .55s cubic-bezier(.2,.9,.3,1.15) .12s both; }
  #cardCv.swap { opacity: .25; transform: scale(.96); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.92); } to { opacity: 1; transform: none; } }
  .shareopts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; flex: none; }
  .shareact { display: flex; gap: 10px; flex: none; }
  .shareact button { flex: 1; min-height: 48px; border-radius: 12px; font: 600 15px system-ui; transition: transform .18s cubic-bezier(.3,1.4,.5,1), background-color .2s; }
  .shareact button:active { transform: scale(.95); }
  .shareact .save { border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  .shareact .go { border: 0; background: var(--accent); color: var(--on-accent); }
  @media (prefers-reduced-motion: reduce) { .sharesheet, .shareov .dim, #cardCv { transition: none !important; animation: none !important; }
  }
  @media (prefers-reduced-motion: reduce) { .roll > span { animation: none !important; } .roll > .old { display: none; } .card { animation: none; } .seg button, .chip, .play, .play svg, .seg .thumb, .credits, #chart.glide #cur, #chart.glide #curDot { transition: none !important; } }
  /* Wide screens: map runs edge to edge, the panel floats over it as a rounded card (same overlay look as the phone). */
  @media (min-width: 900px) {
    .app { position: relative; }
    .mapwrap { position: absolute; inset: 0; }
    .sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 400px; max-height: none; margin: 0;
      border-radius: 22px; box-shadow: 0 10px 34px rgba(0,0,0,.30); }
    .sheet::before { display: none; }
    .credits { bottom: 14px; right: 426px; }
    .sharesheet { left: 50%; right: auto; width: 520px; margin-left: -260px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="mapwrap">
    <div id="map"></div>
    <div class="credits" id="credits"><button aria-label="Map credits">i</button><span id="creditText"></span></div>
    <div class="bar">
      <div class="seg" id="metric"><button data-m="s" class="on">Speed</button><button data-m="k">Mileage</button><button data-m="r">RPM</button></div>
      <div class="seg" id="base"><button data-b="sat" class="on">Satellite</button><button data-b="street">Street</button></div>
    </div>
  </div>

  <div class="sheet">
    <!-- selected point -->
    <div class="card">
      <div class="readout">
        <div class="big"><b id="vSpeed">0</b><span>km/h</span></div>
        <div class="mid">
          <div><b id="vRpm">0</b><span>rpm</span></div>
          <div class="hl"><b id="tKmpl">–</b><span>km/l so far</span></div>
        </div>
        <div class="fuel"><b id="tCost">–</b><span id="tFuel">0.00 L</span></div>
        <div class="gear"><b id="vGear">N</b><span>gear</span></div>
      </div>
      <div class="meta">
        <span><b id="when">--:--</b></span>
        <span><b id="kmFrom">0.0</b> km</span>
        <span>Alt <b id="tAlt">–</b></span>
      </div>
    </div>

    <!-- timeline chart + animation -->
    <div class="card chartcard">
      <div class="legend"><span><i style="background:var(--accent)"></i>Speed</span>
        <span><i style="background:var(--muted)"></i>RPM</span></div>
      <svg id="chart" preserveAspectRatio="none"></svg>
      <div class="controls">
        <button class="play" id="play" aria-label="Play ride"><svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg><svg class="ic-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg></button>
        <span class="elapsed" id="elapsed">0:00</span>
        <span class="grow"></span>
        <button class="chip" id="share">Share</button>
      </div>
    </div>

    <!-- whole trip -->
    <div class="card">
      <h3>Whole trip</h3>
      <div class="stats" id="stats"></div>
    </div>
  </div>
</div>

<div class="shareov" id="shareov" aria-hidden="true">
  <div class="dim" id="shareDim"></div>
  <div class="sharesheet" role="dialog" aria-label="Share ride">
    <div class="grab"></div>
    <div class="sharehead"><b>Share ride</b><button class="x" id="shareClose" aria-label="Close">✕</button></div>
    <div class="cardwrap"><canvas id="cardCv"></canvas></div>
    <div class="shareopts">
      <div class="seg" id="cStyle"><button data-v="dark" class="on">Dark</button><button data-v="light">Light</button><button data-v="accent">Colour</button></div>
      <div class="seg" id="cFmt"><button data-v="post" class="on">Post</button><button data-v="story">Story</button></div>
      <div class="seg" id="cMap"><button data-v="map" class="on">Map</button><button data-v="sat">Satellite</button><button data-v="off">No map</button></div>
    </div>
    <div class="shareact"><button class="save" id="cSave">Save</button><button class="go" id="cShare">Share</button></div>
  </div>
</div>

<script>
(function () {
  // ---------------- data: [lon, lat, alt, kmh, rpm, gear, kmpl, t, kmFromStart, litresSoFar]
  let D;
  try { D = JSON.parse(window.Android.data()); } catch (e) { D = demo(); }
  const P = D.points.filter(p => p[0] && p[1]);
  const S = D.summary || {};
  let TH = null;
  try { TH = JSON.parse(window.Android.theme()); } catch (e) {
    // Outside the app (browser mock / preview): ?dark=1&accent=%23E8930C&share=1
    const Q = new URLSearchParams(location.search);
    if (Q.has("dark") || Q.has("accent") || Q.has("share"))
      TH = { dark: Q.get("dark") === "1", accent: Q.get("accent") || "", share: Q.get("share") === "1" };
  }
  const dark = TH ? TH.dark : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.classList.toggle("dark", dark);
  if (TH && TH.accent) document.documentElement.style.setProperty("--accent", TH.accent);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const ACC = css("--accent"), MUTED = css("--muted"), LINE = css("--line");
  const N = P.length;
  const $ = id => document.getElementById(id);

  // ---------------- route colour scales (green → blue → red)
  const SCALES = {
    s: { key: "s", stops: [[20, "#22c55e"], [55, "#3b82f6"], [95, "#ef4444"]], unit: "km/h", h: 6 },
    k: { key: "k", stops: [[25, "#ef4444"], [35, "#3b82f6"], [45, "#22c55e"]], unit: "km/l", h: 5 },
    r: { key: "r", stops: [[2000, "#22c55e"], [4500, "#3b82f6"], [7500, "#ef4444"]], unit: "rpm", h: 0.05 },
  };
  let metric = "s", base = "sat";

  const colorExpr = m => { const e = ["interpolate", ["linear"], ["get", SCALES[m].key]]; SCALES[m].stops.forEach(([v, c]) => e.push(v, c)); return e; };

  // ---------------- geometry (each segment carries its index so the animation can reveal it)
  const lines = [];
  for (let i = 1; i < N; i++) {
    const a = P[i - 1], b = P[i], props = { i, s: b[3], r: b[4], k: b[6] || a[6] || 0 };
    lines.push({ type: "Feature", properties: props, geometry: { type: "LineString", coordinates: [[a[0], a[1]], [b[0], b[1]]] } });
  }

  // ---------------- map (no API key)
  const SAT = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
  const DEM = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
  const style = b => b === "street" ? "https://tiles.openfreemap.org/styles/liberty" :
    { version: 8, sources: { sat: { type: "raster", tiles: [SAT], tileSize: 256, maxzoom: 17, attribution: "" } },
      layers: [{ id: "sat", type: "raster", source: "sat" }], sky: {} };
  const bounds = new maplibregl.LngLatBounds(); P.forEach(p => bounds.extend([p[0], p[1]]));
  const WIDE = () => innerWidth >= 900;
  const PAD = () => WIDE() ? { top: 70, bottom: 40, left: 40, right: 440 } : { top: 70, bottom: 62, left: 30, right: 30 };
  const map = new maplibregl.Map({ container: "map", style: style(base), bounds: N ? bounds : undefined,
    fitBoundsOptions: { padding: PAD() }, pitch: 55, maxPitch: 80, attributionControl: false });

  window.tripMap = map; // handy for debugging in a browser console
  let revealUpTo = Infinity;
  function addLayers() {
    if (!map.getSource("dem")) map.addSource("dem", { type: "raster-dem", tiles: [DEM], tileSize: 256, maxzoom: 12, encoding: "terrarium" });
    map.setTerrain({ source: "dem", exaggeration: 1.5 });
    if (!map.getSource("route")) map.addSource("route", { type: "geojson", data: { type: "FeatureCollection", features: lines } });
    map.addLayer({ id: "ghost", type: "line", source: "route", paint: { "line-color": "#ffffff", "line-width": 2, "line-opacity": 0.35 } });
    map.addLayer({ id: "route-casing", type: "line", source: "route", paint: { "line-color": "#ffffff", "line-width": 7, "line-opacity": .9 },
      layout: { "line-cap": "round", "line-join": "round" } });
    map.addLayer({ id: "route", type: "line", source: "route", paint: { "line-color": colorExpr(metric), "line-width": 4 },
      layout: { "line-cap": "round", "line-join": "round" } });
    applyReveal();
  }
  map.on("style.load", addLayers);
  // Map credits pill: tap (i) to open, tap again or wait 5 s to close.
  const CREDITS = { sat: "Imagery © Esri · Terrain © Mapzen/AWS", street: "© OpenFreeMap · © OpenStreetMap · Mapzen" };
  const credits = $("credits"); let creditTimer = 0;
  $("creditText").textContent = CREDITS.sat;
  // Animate the real width (measured), so the whole 0.6 s of motion is visible both ways.
  const setCredits = open => {
    credits.classList.toggle("open", open);
    credits.style.width = open ? Math.min(credits.scrollWidth + 2, credits.parentElement.clientWidth - 24) + "px" : "32px";
    clearTimeout(creditTimer);
    if (open) creditTimer = setTimeout(() => setCredits(false), 5000);
  };
  credits.querySelector("button").onclick = () => setCredits(!credits.classList.contains("open"));

  function applyReveal() {
    const f = revealUpTo === Infinity ? null : ["<=", ["get", "i"], revealUpTo];
    ["route", "route-casing"].forEach(id => map.getLayer(id) && map.setFilter(id, f));
  }

  function pin(p, color) {
    const el = document.createElement("div");
    el.style.cssText = `width:12px;height:12px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)`;
    return new maplibregl.Marker({ element: el }).setLngLat([p[0], p[1]]).addTo(map);
  }
  if (N) { pin(P[0], "#22c55e"); pin(P[N - 1], "#ef4444"); }
  const headEl = document.createElement("div");
  headEl.style.cssText = `width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid ${ACC};box-shadow:0 1px 4px rgba(0,0,0,.45)`;
  const head = N ? new maplibregl.Marker({ element: headEl }).setLngLat([P[0][0], P[0][1]]).addTo(map) : null;

  // Tap the route: jump to the nearest recorded point.
  map.on("click", e => {
    let best = -1, bd = 1e9;
    for (let i = 0; i < N; i++) {
      const q = map.project([P[i][0], P[i][1]]), d = (q.x - e.point.x) ** 2 + (q.y - e.point.y) ** 2;
      if (d < bd) { bd = d; best = i; }
    }
    if (best >= 0 && bd < 50 * 50) { stop(); chart.classList.add("glide"); select(best, false); clearTimeout(chart._g); chart._g = setTimeout(() => chart.classList.remove("glide"), 520); map.easeTo({ center: [P[best][0], P[best][1]], duration: 600 }); }
  });

  // ---------------- timeline chart (speed area + RPM line)
  const chart = $("chart");
  const maxS = Math.max(60, ...P.map(p => p[3])), maxR = Math.max(4000, ...P.map(p => p[4]));
  function drawChart() {
    const W = chart.clientWidth || 300, H = chart.clientHeight || 120;

      dot(0, "#22c55e"); dot(R.length - 1, "#ef4444");
    }

    // hero distance
    const movS = S.movingS || 0, mins = Math.round(movS / 60);
    const hero = box.y + box.h + (story ? 170 : 160);
    g.font = F(800, 150); const kmTxt = totalKm.toFixed(1), kmW = (g.letterSpacing = "-4px", g.measureText(kmTxt).width);
    text(kmTxt, pad, hero, F(800, 150), T.hl, "left", -4);
    text("km", pad + kmW + 14, hero, F(600, 52), T.mu);

    // stats row(s)
    const fmtDur = m => m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m} min`;
    const avg = movS > 0 ? Math.round(totalKm / (movS / 3600)) : 0;
    const row1 = [["Riding time", fmtDur(mins)], ["Avg speed", avg ? avg + " km/h" : "–"], ["Top speed", Math.round(S.maxKmh || 0) + " km/h"], ["Mileage", S.kmpl > 0 ? Math.round(S.kmpl) + " km/l" : "–"]];
    const row2 = [["Fuel", S.fuelL ? (D.fuelPrice ? "₹" + Math.round(S.fuelL * D.fuelPrice) : S.fuelL.toFixed(2) + " L") : "–"], ["Climb", Math.round(S.climbM || 0) + " m"], ["Max RPM", S.maxRpm ? Math.round(S.maxRpm) + "" : "–"], ["Breaks", String(S.breaks || 0)]];
    const colW = (W - 2 * pad) / 4;
    g.fillStyle = T.line; g.fillRect(pad, hero + 50, W - 2 * pad, 2);
    const drawRow = (row, y) => row.forEach(([k, v], i) => { const x = pad + i * colW; text(v, x, y, F(700, 44), T.fg, "left", -.5); text(k.toUpperCase(), x, y + 44, F(600, 22), T.mu, "left", 2); });
    drawRow(row1, hero + 130);
    if (story) {
      drawRow(row2, hero + 260);
      // speed profile
      const sy = hero + 385, sh = 130, sx = pad, sw = W - 2 * pad, mx = Math.max(60, ...P.map(p => p[3]));
      const step = Math.max(1, Math.floor(N / 400));
      g.beginPath(); g.moveTo(sx, sy + sh);
      for (let i = 0; i < N; i += step) g.lineTo(sx + i / (N - 1) * sw, sy + sh - P[i][3] / mx * sh);
      g.lineTo(sx + sw, sy + sh); g.closePath();
      const ag = g.createLinearGradient(0, sy, 0, sy + sh); ag.addColorStop(0, cardStyle === "accent" ? "rgba(255,255,255,.35)" : rgba(A, .35)); ag.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = ag; g.fill();
      g.beginPath(); for (let i = 0; i < N; i += step) { const x = sx + i / (N - 1) * sw, y = sy + sh - P[i][3] / mx * sh; i ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.strokeStyle = T.hl; g.lineWidth = 4; g.stroke();
      text("SPEED", sx, sy - 16, F(600, 22), T.mu, "left", 2);
    }

    // footer
    const fy = H - (story ? 80 : 64);
    g.fillStyle = T.line; g.fillRect(pad, fy - 46, W - 2 * pad, 2);
    text("RONIN DASH", pad, fy, F(800, 26), T.fg, "left", 5);
    const lg = [["slow", "#22c55e"], ["", "#3b82f6"], ["fast", "#ef4444"]];
    let lx = W - pad; g.font = F(600, 22);
    text("fast", lx, fy, F(600, 22), T.mu, "right", 1); lx -= g.measureText("fast").width + 18;
    ["#ef4444", "#3b82f6", "#22c55e"].forEach(c => { g.beginPath(); g.arc(lx - 9, fy - 8, 9, 0, 7); g.fillStyle = c; g.fill(); lx -= 26; });
    text("slow", lx - 4, fy, F(600, 22), T.mu, "right", 1);
    if (cardAttrib) text(cardAttrib, W / 2, H - 20, F(500, 17), T.mu, "center", .5);
  }
  let cardAttrib = "";
  try { if (TH && TH.share) setTimeout(openShare, 700); } catch (e) {}

  // ---------------- demo ride (only when opened outside the app)
  function demo() {
    const mins = +new URLSearchParams(location.search).get("demo") || 40, stepMs = mins * 60000 / 600;
    const pts = [], c = [77.5946, 12.9716], t0 = Date.now() - mins * 60000; let fuel = 0, km = 0, prev = null;
    for (let i = 0; i < 600; i++) {
      const a = i / 600 * Math.PI * 2, s = 25 + 75 * Math.abs(Math.sin(a * 2)), gear = s < 20 ? 2 : s < 35 ? 3 : s < 55 ? 4 : 5;
      const r = Math.round(s * (gear === 5 ? 55 : gear === 4 ? 70 : 95) + 400), kmpl = s >= 60 ? 44 - (s - 60) * .2 : 44 - (60 - s) * .1;
      const lon = c[0] + Math.cos(a) * .05, lat = c[1] + Math.sin(a) * .035;
      if (prev) { const d = Math.hypot((lon - prev[0]) * 109000, (lat - prev[1]) * 110540) / 1000; km += d; fuel += d / kmpl * Math.sqrt(r / s / 55); }
      prev = [lon, lat];
      pts.push([lon, lat, 900 + 30 * Math.sin(a * 3), s, r, gear, kmpl, t0 + i * stepMs, km, fuel]);
    }
    return { points: pts, summary: { km, start: t0, end: t0 + mins * 60000, movingS: mins * 55, maxKmh: 100, maxRpm: 6100, fuelL: fuel, kmpl: km / fuel, climbM: 84 }, fuelPrice: 103 };
  }
})();
</script>
